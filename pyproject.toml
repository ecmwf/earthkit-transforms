[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77", "setuptools_scm>=8"]

[project]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering"
]
dependencies = [
  # 2023.9.0 is the first release with apply_ufunc(on_missing_core_dim=...), which the
  # Fourier transforms use to pass through Dataset variables that lack the transform dimension.
  "xarray>=2023.9.0",
  # 1.20 is the first release whose numpy.fft functions accept norm="backward"/"forward";
  # earlier versions accept only None or "ortho", so the Fourier transforms' default norm fails.
  "numpy>=1.20",
  "earthkit-utils~=1.0"
]
description = "Aggregation tools for meteorological and climate data."
dynamic = ["version"]
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "earthkit-transforms"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
all = [
  "earthkit-data~=1.0",
  "geopandas",
  "rasterio"  # Requires GDAL
]
ci = [
  "earthkit-transforms[all]",
  "pre-commit",
  "mypy",
  "pytest",
  "pytest-cov",
  "pandas-stubs",
  "types-PyYAML"
]
docs = [
  "earthkit-transforms[ci]",
  "ipykernel",
  "Pygments>=2.6.1",
  "Sphinx",
  "docutils",
  "entrypoints",
  "filelock",
  "furo",
  "sphinx-design",
  "nbconvert",
  "nbsphinx",
  "myst-parser",
  "tqdm",
  "pandoc",
  "pypandoc-binary",
  "PyYAML",
  "setuptools",
  "statsmodels",
  "reverse-geocode",
  "earthkit-plots~=1.0"
]

[tool.coverage.run]
branch = true

[tool.mypy]
exclude = '(^tests/legacy-api/|^build/)'
ignore_missing_imports = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
  "D1",  # pydocstyle: Missing Docstrings
  "D107",  # pydocstyle: numpy convention
  "D203",
  "D205",
  "D212",
  "D213",
  "D401",
  "D402",
  "D413",
  "D415",
  "D416",
  "D417"
]
select = [
  "F",  # pyflakes
  "E",  # pycodestyle
  "W",  # pycodestyle warnings
  "I",  # isort
  "D"  # pydocstyle
]

[tool.setuptools.packages.find]
include = ["earthkit.transforms"]
where = ["src/"]

[tool.setuptools_scm]
local_scheme = "no-local-version"
write_to = "src/earthkit/transforms/version.py"
write_to_template = '''
# Do not change! Do not track in version control!
__version__ = "{version}"
'''
